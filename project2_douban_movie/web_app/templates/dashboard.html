{% extends 'base.html' %}
{% block title %}数据概览{% endblock %}
{% block page_title %}数据概览{% endblock %}

{% block content %}
<div id="dashboard-loading" class="loading-spinner">
    <div class="spinner"></div>
    <p>加载数据中...</p>
</div>

<div id="dashboard-content" style="display:none;">
    <div class="stat-grid">
        <div class="stat-card">
            <div class="stat-icon stat-icon-blue">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">电影总数</span>
                <span class="stat-value" id="stat-total">--</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon-green">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">平均评分</span>
                <span class="stat-value" id="stat-rating">--</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon-orange">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">总评分人次</span>
                <span class="stat-value" id="stat-votes">--</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon stat-icon-purple">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
            </div>
            <div class="stat-info">
                <span class="stat-label">类型数量</span>
                <span class="stat-value" id="stat-genres">--</span>
            </div>
        </div>
    </div>

    <div class="chart-grid">
        <div class="card">
            <div class="card-title">评分分布</div>
            <div id="chart-rating" style="width:100%;height:350px;"></div>
        </div>
        <div class="card">
            <div class="card-title">类型分布 Top 15</div>
            <div id="chart-genre" style="width:100%;height:350px;"></div>
        </div>
        <div class="card">
            <div class="card-title">近年电影数量趋势</div>
            <div id="chart-year" style="width:100%;height:350px;"></div>
        </div>
        <div class="card">
            <div class="card-title">Top 10 高分电影</div>
            <div class="table-wrapper">
                <table class="data-table">
                    <thead><tr><th>排名</th><th>电影名称</th><th>评分</th><th>评分人数</th><th>类型</th><th>年份</th></tr></thead>
                    <tbody id="top-movies"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    var charts = {};
    var COLORS = ['#5470c6','#91cc75','#fac858','#ee6666','#73c0de','#3ba272','#fc8452','#9a60b4','#ea7ccc','#48b8d0','#ff9f7f','#fb7293','#e7bcf3','#8378ea','#96dee8'];

    fetch('/api/dashboard-stats').then(r => r.json()).then(function(d) {
        document.getElementById('stat-total').textContent = d.total_movies.toLocaleString();
        document.getElementById('stat-rating').textContent = d.avg_rating.toFixed(1);
        document.getElementById('stat-votes').textContent = d.total_votes.toLocaleString();
        document.getElementById('stat-genres').textContent = d.genre_count;

        document.getElementById('dashboard-loading').style.display = 'none';
        document.getElementById('dashboard-content').style.display = '';

        // Rating distribution
        charts.rating = echarts.init(document.getElementById('chart-rating'));
        charts.rating.setOption({
            tooltip: { trigger:'axis', axisPointer:{type:'shadow'} },
            grid: { left:'3%', right:'4%', bottom:'3%', top:'10%', containLabel:true },
            xAxis: { type:'category', data: d.rating_distribution.labels, axisLabel:{fontSize:11,rotate:30} },
            yAxis: { type:'value', name:'数量' },
            series: [{ type:'bar', data: d.rating_distribution.values, barWidth:'65%',
                itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#60a5fa'},{offset:1,color:'#2563eb'}]), borderRadius:[4,4,0,0] }
            }]
        });

        // Genre pie
        charts.genre = echarts.init(document.getElementById('chart-genre'));
        var gd = d.genre_distribution.labels.map(function(l,i){ return {name:l, value:d.genre_distribution.values[i]}; });
        charts.genre.setOption({
            tooltip: { trigger:'item', formatter:'{b}: {c} ({d}%)' },
            legend: { type:'scroll', orient:'vertical', right:'2%', top:'middle', textStyle:{fontSize:11} },
            color: COLORS,
            series: [{ type:'pie', radius:['25%','65%'], center:['38%','50%'], roseType:'area',
                itemStyle:{borderRadius:6, borderColor:'#fff', borderWidth:2},
                label:{show:true, formatter:'{b}', fontSize:11},
                data: gd }]
        });

        // Year trend
        charts.year = echarts.init(document.getElementById('chart-year'));
        charts.year.setOption({
            tooltip: { trigger:'axis' },
            grid: { left:'3%', right:'4%', bottom:'3%', top:'10%', containLabel:true },
            xAxis: { type:'category', boundaryGap:false, data: d.year_trend.labels },
            yAxis: { type:'value', name:'数量' },
            series: [{ type:'line', smooth:true, symbol:'circle', symbolSize:5,
                lineStyle:{width:3, color:'#5470c6'}, itemStyle:{color:'#5470c6'},
                areaStyle:{ color: new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(84,112,198,0.35)'},{offset:1,color:'rgba(84,112,198,0.02)'}]) },
                data: d.year_trend.values }]
        });

        // Top movies table
        var tbody = document.getElementById('top-movies');
        d.top_movies.forEach(function(m, i) {
            var r = parseFloat(m['评分']) || 0;
            var rc = r >= 8 ? 'rating-high' : r >= 6 ? 'rating-mid' : 'rating-low';
            var votes = m['评分人数'] ? Number(m['评分人数']).toLocaleString() : '--';
            tbody.innerHTML += '<tr><td>'+(i+1)+'</td><td>'+m['电影名称']+'</td><td><span class="rating-badge '+rc+'">'+r.toFixed(1)+'</span></td><td>'+votes+'</td><td>'+(m['类型']||'--')+'</td><td>'+(m['上映年份']||'--')+'</td></tr>';
        });

        requestAnimationFrame(function() {
            Object.values(charts).forEach(function(c){ c.resize(); });
        });
    });

    window.addEventListener('resize', function() {
        Object.values(charts).forEach(function(c){ c.resize(); });
    });
})();
</script>
{% endblock %}
